# Evaluation protocol (GUIDE.md section 4.4), shared by every experiment. Changing anything
# here invalidates earlier results (CLAUDE.md rule 6): record the change in notes/ and re-run
# the affected experiments. The reasons for each choice are in notes/02-protocol.md.
# Version 2 (phase 5) adds M4 and the face-only framing; M1-M3 and everything they use are
# unchanged, so version-1 results stay valid (notes/02-protocol.md section 11).
version: 2

regions:
  # Regions are found once, on the uncompressed source, from MediaPipe pose landmarks sampled
  # at this rate, and reused for every compressed version (scaled with the resolution).
  pose_sample_fps: 2.0
  visibility_threshold: 0.5
  # Below this fraction of sampled frames with both shoulders visible, the shoulder band is
  # anchored to the face instead (marked "face_anchored").
  min_shoulder_frac: 0.5
  # Face-only framing (phase 5): a square crop of the head, found from the same median
  # landmarks, simulates a video that shows only the face. Sizes are in face widths (the
  # horizontal span of the face landmarks, ears included).
  face_only:
    above_eyes: 1.0  # top of the crop above the eye line
    below_mouth: 0.5  # bottom of the crop below the mouth line
    shoulder_margin: 0.1  # with shoulders in view, the crop ends this far above M1's shoulder band

measurements:
  M1:  # breathing from the vertical motion of the shoulder band
    kind: breathing
    signal: motion
    region: shoulder
    band_hz: [0.1, 0.7]
    window_s: 30.0
  M2:  # breathing from the face color signal (POS over the whole analysis window)
    kind: breathing
    signal: color
    region: face
    band_hz: [0.1, 0.7]
    window_s: 30.0
    pos_window_s: null  # null: one POS projection per analysis window
  M3:  # heart rate from the face color signal (standard POS, 1.6 s overlap-add)
    kind: heart
    signal: color
    region: face
    band_hz: [0.7, 3.0]
    window_s: 10.0
    pos_window_s: 1.6
  M4:  # breathing from the vertical motion of the head (phase 5, for face-only video)
    kind: breathing
    signal: motion
    region: head
    band_hz: [0.1, 0.7]
    window_s: 30.0

rate:
  # Per window: linear detrend, zero-phase Butterworth band-pass, Hann-windowed periodogram
  # zero-padded to at least min_nfft points, highest peak in the band, parabolic interpolation.
  filter_order: 2
  min_nfft: 4096
  # The band's upper edge is lowered to this fraction of the Nyquist frequency when the
  # (decimated) frame rate is too low for it.
  max_nyquist_frac: 0.95
  # SNR: power within +-k/T of the reference frequency and its second harmonic, over the
  # rest of the band (T = window length; k = 2 is the half-width of the Hann main lobe).
  snr_half_width_bins: 2.0

tolerance_bpm:
  breathing: 2.0
  heart: 5.0

reference:
  ppg_respiration:
    # Beat-by-beat baseline (BW), amplitude (AM) and interval (FM) series, resampled to this
    # rate; a window is usable when the three rates span at most agreement_bpm.
    resample_hz: 4.0
    agreement_bpm: 2.0
    beat_band_hz: [0.5, 5.0]
    max_heart_bpm: 180.0
  oximeter_min_valid_bpm: 30.0
  ubfc_gap_flag_s: 0.5

statistics:
  bootstrap_samples: 2000
  ci: 0.95
  seed: 0

breakdown:
  # Breakdown point of a ladder: the highest-quality rung whose success rate is more than
  # drop_pp percentage points below the uncompressed source (paired), with the lower CI bound
  # above zero, and every lower-quality rung also more than drop_pp below.
  drop_pp: 10.0

compression:
  pix_fmt: yuv420p
  preset: medium
  # Only the first frame is a keyframe (no periodic or scene-cut keyframes): periodic
  # keyframes would add an artifact at 1/interval Hz and its multiples.
  gop_frames: 100000
  scale_flags: area
  # One encoder thread: x264's sliced threads (zerolatency) make bitrate-mode output differ
  # from run to run, and multi-threaded output depends on the machine's core count.
  threads: 1
  vbv_buffer_s: 1.0  # bitrate and allocation ladders: VBV buffer = target bitrate x 1 s
  ladders:
    crf:  # storage / recording: ffmpeg defaults otherwise (B-frames on)
      codecs: [libx264, libx265]
      crf: [0, 18, 23, 28, 33, 38, 43]
    bitrate:  # video call: zerolatency, no B-frames, 1 s VBV buffer
      codecs: [libx264, libx265]
      kbps: [2000, 1000, 500, 250, 125]
    allocation:  # Q3: video-call settings at fixed bitrates, with integer frame decimation
      codecs: [libx264, libx265]
      kbps: [500, 250, 125]
      decimate: [1, 2, 3, 6]  # 30, 15, 10, 5 fps for a 30 fps source
      scale: [1, 2, 4]  # full, 1/2, 1/4 resolution
